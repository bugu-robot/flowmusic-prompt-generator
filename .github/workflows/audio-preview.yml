name: Audio preview verification

on:
  push:
    branches: [main, feat/audio-preview-system]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit
      - name: Install FFmpeg for committed-audio verification
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run code, production-build, and committed-audio checks
        run: npm run typecheck && npm run lint && npm test && npm run build && npm run build -- --mode pages && npm run audio:similarity && npm run audio:verify
      - name: Package the review archive from committed assets
        run: npm run audio:package
      - name: Upload complete audio review package
        uses: actions/upload-artifact@v4
        with:
          name: audio-preview-review
          path: .artifacts/audio-preview-review.zip
          if-no-files-found: error
          retention-days: 14
