name: Real Chromium browser E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked production dev dependencies
        run: npm ci
      - name: Install pinned test-only Playwright without editing package or lockfile
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install real Chromium and required shared libraries
        run: npx playwright install --with-deps chromium
      - name: Compile production Pages build
        run: npm run build -- --mode pages
      - name: Run real Chromium interactive regression tests
        run: node scripts/browser-e2e.mjs
